name: Build PSP EBOOT
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Package
        run: |
          mkdir -p dist/KartRacer
          cp EBOOT.PBP dist/KartRacer/
      - uses: actions/upload-artifact@v4
        with:
          name: KartRacer
          path: dist
